<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Evaluation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.3/css/bulma.min.css">
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
</head>
<body>
<section class="section">
    <div class="container">
        <h1 class="title">Python Evaluation</h1>

        <!-- Sticky Submit button container -->
        <div style="position: sticky; top: 0; z-index: 1000; background: white; padding: 10px 0; border-bottom: 1px solid #eaeaea; margin-bottom: 1.5rem;">
            <button class="button is-primary" onclick="submitAnswers()">Save</button>
            <span id="submitMessage" style="margin-left: 1rem; font-weight: bold;"></span>
        </div>

        <div class="field is-grouped is-grouped-multiline">
            <label class="label" style="display:inline; margin-right:0.5em;">Applicant Name:</label>
            <span>{{payload['applicant_name']}}</span>
            <label class="label" style="display:inline; margin-right:0.5em; margin-left: 50px;">Applicant ID:</label>
            <span id="applicant_id" style="margin-right: 1rem;">{{payload['applicant_id']}}</span>
            <button type="button" style="margin-left: 1rem; background: transparent; border: none; color: green; font-weight: bold; font-size: 1.5rem; cursor: pointer; align-self: baseline; line-height: 1; vertical-align: top;" onclick="register()">+</button>

        </div>

        {% for question in payload['questions'] %}
            {% set key = question['id'] %}
        <div class="field" style="position: relative; margin-bottom: 2rem;">
            <label class="label">{{key}}. {{ question['question'] }}</label>

                <button
                type="button"
                class="button is-small is-light"
                onclick="runCode({{key}})"
                title="Run Code"
                >
                        ▶️
                </button>


            <!-- Hidden value for pre-filling the editor -->
            <input type="hidden" id="hidden_answer_{{key}}" value="{{question['answer']|e}}">

            <div id="editor_{{key}}" class="monaco-editor" style="height: 120px; border: 1px solid #ccc; overflow: hidden; resize: vertical;"></div>



            <b>expected output:</b> <i>{{question['expected_output']}}</i>
            <pre class="output-box" id="output_{{key}}"
                 style="background: #f4f4f4; padding: 10px; margin-top: 10px; border-radius: 5px;"></pre>

        </div>
        {% endfor %}

</section>

<script>
    let editors = {};  // Store all editor instances by question key

    // Load Monaco Editor
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
        document.querySelectorAll('[id^="editor_"]').forEach(div => {
            const key = div.id.split('_')[1];
            const initialValue = document.getElementById(`hidden_answer_${key}`).value || '';
            editors[key] = monaco.editor.create(div, {
                value: initialValue,
                language: 'python',
                theme: 'vs-light',
                automaticLayout: true
            });
        });
    });

    // Submit all answers
    function submitAnswers() {
        try {
            console.log(document.getElementById('applicant_id'))
            const applicant_id = document.getElementById('applicant_id').textContent.trim();
            const answers = {};

            for (const key in editors) {
                answers[key] = editors[key].getValue();
            }

            fetch('/submit_evaluation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ applicant_id, answers })
            })
            .then(res => res.text())
            .then(response => {
                document.getElementById('submitMessage').innerText = "✅ Answers submitted successfully!";
            })
            .catch(err => {
                document.getElementById('submitMessage').innerText = "❌ Failed to submit answers.";
                console.error(err);
            });
        } catch (e) {
            console.error("An error occurred during submission:", e);
            document.getElementById('submitMessage').innerText = "❌ An unexpected error occurred.";
        }
    }

    // Run code for a specific question
    function runCode(index) {
        const code = editors[index]?.getValue() || '';
        fetch('/run', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: code
        })
        .then(response => response.text())
        .then(output => {
            document.getElementById(`output_${index}`).textContent = output;
        })
        .catch(error => {
            document.getElementById(`output_${index}`).textContent = 'Error running code.';
            console.error(error);
        });
    }

    function register() {
        const applicant_id = document.getElementById('applicant_id').textContent.trim();
        fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ applicant_id })
        })
        .then(res => res.text())
        .then(response => {
            alert(response); // Or update a message div
        })
        .catch(err => {
            console.error('Error registering applicant:', err);
        });
    }
</script>
</body>
</html>
