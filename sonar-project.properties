sonar.projectKey=viswavisan_applications
sonar.organization=viswavisan
sonar.host.url=https://sonarcloud.io
sonar.projectName=Applications Project
sonar.projectVersion=1.0

# Sources to be analyzed for bugs, vulnerabilities, and code smells
sonar.sources=.

# Path to the coverage report generated by pytest
sonar.python.coverage.reportPaths=coverage.xml

# Exclude all other files from the final coverage calculation
sonar.coverage.exclusions=**/*,!**/fit_mafia/app_controller.py

# General exclusions for non-source files
sonar.exclusions=**/__pycache__/**,**/*.pyc,venv/**

# Encoding
sonar.sourceEncoding=UTF-8
