# Required identifiers
sonar.projectKey=viswavisan_applications
sonar.organization=viswavisan
sonar.host.url=https://sonarcloud.io
sonar.python.coverage.reportPaths=coverage.xml
sonar.projectName=Applications Project
sonar.projectVersion=1.0

# Source code location
sonar.sources=.

# Exclude virtual environment and test folders if needed
sonar.exclusions=**/__pycache__/**,**/*.pyc,venv/**

# Coverage report path (generated by pytest --cov-report=xml)

sonar.coverage.exclusions=**/*

# Encoding of source files
sonar.sourceEncoding=UTF-8