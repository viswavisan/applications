name: Move Issue to Development
on:
  create:
    branches:
      - 'feature/*' # Trigger on branches starting with feature/
      - '[0-9]*'    # Or branches starting with a number

jobs:
  move-to-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Issue Number
        id: get_issue
        run: |
          # This regex finds the first number in the branch name
          BRANCH_NAME="${{ github.ref_name }}"
          ISSUE_ID=$(echo $BRANCH_NAME | grep -oE '[0-9]+' | head -1)
          echo "issue_id=$ISSUE_ID" >> $GITHUB_OUTPUT

      - name: Update Issue Label
        if: steps.get_issue.outputs.issue_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ID: ${{ steps.get_issue.outputs.issue_id }}
        run: |
          # Add a 'development' label to the issue
          gh issue edit $ISSUE_ID --add-label "development"
          
          # Optional: Add a comment to the issue
          gh issue comment $ISSUE_ID --body "Branch created! Moving this to Development."
