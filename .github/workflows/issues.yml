name: Issues Automation
on:
  push:
    branches-ignore:
      - main

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          if [[ ! "$BRANCH_NAME" =~ ^issue-[0-9]+_.+ ]]; then
            echo "❌ Branch name '$BRANCH_NAME' does not follow 'issue-<number>_<description>' format."
            exit 1
          fi


          ISSUE_NUMBER=$(echo "$BRANCH_NAME" | sed -E 's/^issue-([0-9]+)_.+/\1/')
          echo "✅ Branch name '$BRANCH_NAME' is valid."
          echo "📌 Extracted issue number: $ISSUE_NUMBER"
      
          # Optionally set it as an output for later steps
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
      - name: Check issue exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔎 Checking if issue #$ISSUE_NUMBER exists..."
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/$ISSUE_NUMBER")

          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ Issue #$ISSUE_NUMBER does not exist in ${GITHUB_REPOSITORY}."
            cat response.json
            exit 1
          else
            echo "✅ Issue #$ISSUE_NUMBER exists in ${GITHUB_REPOSITORY}."
          fi

      - name: Check for duplicate issue branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔎 Checking if another branch with issue-$ISSUE_NUMBER exists..."
          # Fetch all branches
          BRANCHES=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            | jq -r '.[].name')

          # Look for other branches with same issue number
          DUPLICATE=$(echo "$BRANCHES" | grep -E "^issue-${ISSUE_NUMBER}_")

          if [[ -n "$DUPLICATE" && "$DUPLICATE" != "$BRANCH_NAME" ]]; then
            echo "❌ Another branch already exists with issue-$ISSUE_NUMBER:"
            echo "$DUPLICATE"
            exit 1
          else
            echo "✅ No duplicate branches found for issue-$ISSUE_NUMBER."
          fi


