name: Issues Automation
on:
  push:
    branches-ignore:
      - main

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:

      - name: Check branch name
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          if [[ ! "$BRANCH_NAME" =~ ^issue-[0-9]+_.+ ]]; then
            echo "❌ Branch name '$BRANCH_NAME' does not follow 'issue-<number>_<description>' format."
            exit 1
          fi

          ISSUE_NUMBER=$(echo "$BRANCH_NAME" | sed -E 's/^issue-([0-9]+)_.+/\1/')
          echo "✅ Branch name '$BRANCH_NAME' is valid."
          echo "📌 Extracted issue number: $ISSUE_NUMBER"

          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Check issue exists and status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔎 Checking if issue #$ISSUE_NUMBER exists..."
          RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/$ISSUE_NUMBER")

          ISSUE_STATE=$(echo "$RESPONSE" | jq -r '.state')

          if [[ "$ISSUE_STATE" == "null" ]]; then
            echo "❌ Issue #$ISSUE_NUMBER does not exist in ${GITHUB_REPOSITORY}."
            exit 1

          elif [[ "$ISSUE_STATE" == "open" ]]; then
            echo "✅ Issue #$ISSUE_NUMBER exists and is OPEN."
            echo "Setting status to 'development'..."
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/$ISSUE_NUMBER/labels" \
              -d '{"labels":["status: development"]}'
          elif [[ "$ISSUE_STATE" == "closed" ]]; then
            echo "⚠️ Issue #$ISSUE_NUMBER exists but is CLOSED."
            exit 1
          else
            echo "❓ Unexpected issue state: $ISSUE_STATE"
            exit 1
          fi
