name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest


  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Trigger Render Deploy
        id: trigger
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: Bearer rnd_oH3mo7qi20XqprxbjzX6ypmwicm6" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/srv-d5q9lrfgi27c73f7fhc0/deploys)
  
          echo "deploy_id=$(echo $response | jq -r '.id')" >> $GITHUB_ENV

      - name: Wait for Render Deploy to Finish
        run: |
          echo "Waiting for Render deploy $deploy_id ..."
          for i in {1..30}; do
            response=$(curl -s \
              -H "Authorization: Bearer rnd_oH3mo7qi20XqprxbjzX6ypmwicm6" \
              https://api.render.com/v1/deploys/$deploy_id)
  
            status=$(echo $response | jq -r '.status')
            echo "Current status: $status"
  
            if [ "$status" = "live" ]; then
              echo "✅ Deploy finished successfully!"
              exit 0
            elif [ "$status" = "failed" ]; then
              echo "❌ Deploy failed."
              exit 1
            fi
  
            sleep 10
          done
  
          echo "❌ Timed out waiting for deploy."
          exit 1
