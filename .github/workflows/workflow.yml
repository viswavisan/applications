name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test  # deploy only if tests pass
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v1
        with:
          serviceId: srv-d5q9lrfgi27c73f7fhc0
          apiKey: rnd_oH3mo7qi20XqprxbjzX6ypmwicm6

