name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test   # ensures deploy runs only if tests succeed
    steps:
      - name: Deploy to Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}


name: Move Issue to Development
on:
  create:
    branches:
      - 'feature/*' # Trigger on branches starting with feature/
      - '[0-9]*'    # Or branches starting with a number

jobs:
  move-to-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Issue Number
        id: get_issue
        run: |
          # This regex finds the first number in the branch name
          BRANCH_NAME="${{ github.ref_name }}"
          ISSUE_ID=$(echo $BRANCH_NAME | grep -oE '[0-9]+' | head -1)
          echo "issue_id=$ISSUE_ID" >> $GITHUB_OUTPUT

      - name: Update Issue Label
        if: steps.get_issue.outputs.issue_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ID: ${{ steps.get_issue.outputs.issue_id }}
        run: |
          # Add a 'development' label to the issue
          gh issue edit $ISSUE_ID --add-label "development"
          
          # Optional: Add a comment to the issue
          gh issue comment $ISSUE_ID --body "Branch created! Moving this to Development."
