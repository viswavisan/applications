name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Trigger Render Deploy
          id: trigger
          run: |
            echo "Triggering deploy for service ${{ secrets.RENDER_SERVICE_ID }} ..."
            response=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys)
  
            echo "Raw trigger response: $response"
            deploy_id=$(echo $response | jq -r '.id')
  
            if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
              echo "❌ Failed to trigger deploy. Response was: $response"
              exit 1
            fi
  
            echo "DEPLOY_ID=$deploy_id" >> $GITHUB_ENV

        - name: Wait for Render Deploy to Finish
          run: |
            echo "Waiting for Render deploy $DEPLOY_ID ..."
            for i in {1..30}; do
              response=$(curl -s \
                -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                https://api.render.com/v1/deploys/$DEPLOY_ID)
  
              echo "Raw status response: $response"
              status=$(echo $response | jq -r '.status')
  
              if [ "$status" = "live" ]; then
                echo "✅ Deploy finished successfully!"
                exit 0
              elif [ "$status" = "failed" ]; then
                echo "❌ Deploy failed."
                exit 1
              fi
  
              echo "Current status: $status (waiting...)"
              sleep 10
            done
  
            echo "❌ Timed out waiting for deploy."
            exit 1
